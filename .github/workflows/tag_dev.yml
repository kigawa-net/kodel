name: tag dev version

on:
  push:
    branches:
      - develop

jobs:
  tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          fetch-depth: 0

      - name: Get next version from latest tag
        id: get_version
        run: |
          git tag --list
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*-dev' | sed 's/-dev$//' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            LATEST="0.0.0"
          fi
          MAJOR=$(echo "$LATEST" | cut -d. -f1)
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-dev"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Delete existing dev tag if exists
        run: |
          git push origin :refs/tags/${{ steps.get_version.outputs.version }} || true

      - name: Create and push dev tag
        run: |
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}